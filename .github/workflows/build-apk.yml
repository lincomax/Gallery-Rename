name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Use permanent key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then echo "SIGNING_KEYSTORE secret missing"; exit 1; fi
          echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/app.keystore"
      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/app.keystore
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
          SIGNING_KEY_PASSWORD: android
        run: chmod +x gradlew && ./gradlew assembleFossRelease
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          TAG="v$VERSION-${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/foss/release/*.apk \
            --target "${{ github.sha }}" \
            --title "Gallery $VERSION (build ${{ github.run_number }})" \
            --notes "Custom build of Fossify Gallery $VERSION"